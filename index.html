<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴젠빌2 관리실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 미드나잇 스타일 (네이비·그레이 다크톤) ===== */
  :root{
    color-scheme:dark;
    --bg:#0e1621; --surface:#152131; --panel:#1b2a3d;
    --text:#e3e9f0; --sub:#9eacbc; --muted:#6c7b8d; --line:#2a3a4f;
    --strong:#d3dce6; --primary:#c9d5e2; --primary-2:#e3e9f0; --on-primary:#0e1621; --accent:#8fb0d6;
    --common-bg:#3a526e; --common-fg:#ffffff;
    --occ-bg:#26405f;  --occ-fg:#ffffff;
    --vac-bg:#131e2c;  --vac-fg:#5f6e80;
    --sel:#1f3350;
    --in:#ff8a80; --out:#8ab4ff; --danger:#ff8a80;
    --title-font:"Noto Sans KR","Malgun Gothic",sans-serif;
    --topline:#3a526e;
    --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }

  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
       -webkit-font-smoothing:antialiased;border-top:6px solid var(--topline)}
  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}

  /* ---------- 페이지 머리말 ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px;margin-bottom:18px;flex-wrap:wrap}
  .brand{font-size:.72rem;letter-spacing:.14em;color:var(--sub);font-weight:700}
  .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .who .user{font-size:.78rem;color:var(--sub)}
  .who .user b{color:var(--strong);font-weight:600}
  .page-head{border-bottom:1px solid var(--strong);padding-bottom:14px;margin-bottom:24px}
  .kicker{font-size:.72rem;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-bottom:6px}
  h1{font-family:var(--title-font);font-weight:700;font-size:1.9rem;line-height:1.25;margin:0;color:var(--strong);letter-spacing:-.01em}
  .subtitle{color:var(--sub);margin-top:6px;font-size:.92rem}

  /* ---------- 로그인 ---------- */
  .login{max-width:380px;margin:40px auto 0}
  .login .msg{font-size:.85rem;color:var(--danger);margin-bottom:12px;white-space:pre-line}
  .login .btn{width:100%;padding:10px}

  /* ---------- 메인 표 ---------- */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .cell{position:relative;min-height:104px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
        display:flex;align-items:center;justify-content:center;padding:28px 6px 10px;text-align:center;
        word-break:keep-all;font-size:1rem;font-weight:500;transition:box-shadow .15s,transform .15s}
  .cell.occupied{border-color:transparent}
  .cell:hover{box-shadow:inset 0 0 0 2px var(--accent)}
  .cell .names{white-space:pre-line}
  .label{position:absolute;top:8px;left:10px;font-size:.75rem;font-weight:700;letter-spacing:.04em;opacity:.85}
  .common{grid-column:1 / -1;background:var(--common-bg);color:var(--common-fg);min-height:64px}
  .common .names{font-size:.85rem;opacity:.8;font-weight:400}
  .occupied{background:var(--occ-bg);color:var(--occ-fg)}
  .vacant{background:var(--vac-bg);color:var(--vac-fg)}
  .vacant .names{font-weight:400}
  .vacant .label{color:var(--sub)}
  .legend{display:flex;gap:18px;justify-content:space-between;align-items:center;margin-top:12px;font-size:.8rem;color:var(--sub);flex-wrap:wrap}
  .legend .keys{display:flex;gap:16px}
  .legend .keys span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
  .lg-occ::before{background:var(--occ-bg)}
  .lg-vac::before{background:var(--vac-bg)}
  .databar{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:.78rem;color:var(--sub);flex-wrap:wrap}
  .live{font-size:.72rem;color:var(--muted);margin-left:auto}
  .live.on::before{content:"●";color:#7fd48a;margin-right:4px}
  .tag{display:inline-block;font-size:.68rem;padding:1px 6px;border:1px solid var(--line);border-radius:10px;color:var(--muted);margin-left:2px;vertical-align:1px}
  td.histamt{color:var(--muted)}
  .cal .amt.hist{color:var(--muted);font-weight:500}
  .cal .amt.hist::before{content:"이월전 ";font-size:.62rem;opacity:.8}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:.75rem;color:var(--sub)}
  .cal-legend .hist-c{color:var(--muted)}
  @media (max-width:600px){ .cal .amt.hist::before{content:""} }
  .histopt{font-size:.8rem;color:var(--sub);display:flex;align-items:center;gap:4px;cursor:pointer}
  .histopt input{accent-color:var(--primary)}
  .hist-note{font-size:.8rem;color:#f2c26b;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px;margin:-4px 0 14px}
  td.expired{color:var(--in);font-weight:700}
  td.soon{color:#f2c26b;font-weight:700}
  .overlay.top{z-index:20}
  .summary small.kpi-note{margin:6px 0 0;font-weight:500;letter-spacing:0;color:var(--muted)}
  .modal.dialog{max-width:380px}
  .modal.dialog .btns .danger{margin-right:0}
  .dlg-msg{white-space:pre-line;font-size:.95rem;line-height:1.6;margin-bottom:10px}
  .dlg-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--text);font-size:1rem;font-family:inherit;margin-bottom:8px}
  tbody tr.click{cursor:pointer}
  .subhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;font-size:.85rem;font-weight:700;color:var(--sub);letter-spacing:.04em}
  .source{font-size:.75rem;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:8px}
  .tbl-input{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.85rem}
  .tbl-input:disabled{opacity:.6}

  /* ---------- 단락 ---------- */
  .section{margin-bottom:34px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px;flex-wrap:wrap;
            border-bottom:1px solid var(--line);padding-bottom:10px}
  .sec-head h2{font-family:var(--title-font);font-size:1.2rem;margin:0;color:var(--strong);font-weight:700}
  .sec-head h2 .num{color:var(--accent);margin-right:8px}

  /* ---------- 표 ---------- */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.88rem;white-space:nowrap;font-variant-numeric:tabular-nums}
  th{font-size:.74rem;letter-spacing:.06em;color:var(--sub);font-weight:700;text-align:left;
     padding:8px 10px;border-bottom:1px solid var(--line);background:transparent}
  td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  tbody tr:hover td{background:var(--panel)}
  th:last-child,td:last-child{text-align:right}
  td.num,th.num{text-align:right}
  td.memo{white-space:normal;min-width:100px;color:var(--sub)}
  td.in,.in{color:var(--in)} td.out,.out{color:var(--out)}
  td.bal{font-weight:700;color:var(--strong)}
  .empty{color:var(--muted);padding:18px 0;font-size:.9rem}
  .note{font-size:.78rem;color:var(--muted);margin:8px 0}
  .total{text-align:right;margin-top:8px;font-size:.9rem;color:var(--sub)}
  .total b{color:var(--strong);font-size:1rem;margin-left:6px}

  /* ---------- 버튼 ---------- */
  .btn{border:1px solid var(--primary);background:var(--surface);color:var(--primary);border-radius:5px;padding:7px 14px;cursor:pointer;
       font-size:.85rem;font-family:inherit;font-weight:600;white-space:nowrap;letter-spacing:.02em}
  .btn:hover{background:var(--panel)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn.primary{background:var(--primary);color:var(--on-primary)}
  .btn.primary:hover{background:var(--primary-2)}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  .btn.small{padding:4px 10px;font-size:.78rem}
  .btn.ghost{border-color:transparent;background:transparent;padding-left:0;color:var(--sub)}
  .btn.ghost:hover{color:var(--strong)}
  .btn.edit{border-color:var(--line);color:var(--sub);font-weight:500}
  .btn.edit:hover{border-color:var(--primary);color:var(--primary);background:var(--surface)}
  .linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:.85rem;font-family:inherit;padding:0;font-weight:600}
  .linkbtn:hover{text-decoration:underline}
  a{color:inherit}

  /* ---------- 보기 전환 (탭) ---------- */
  .toggle{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .toggle button{border:0;background:none;padding:8px 0;cursor:pointer;font-size:.95rem;font-family:inherit;color:var(--sub);
                 border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600}
  .toggle button.on{color:var(--strong);border-bottom-color:var(--strong)}

  /* ---------- 핵심지표 ---------- */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:30px}
  .summary div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .summary small{display:block;color:var(--sub);font-size:.72rem;letter-spacing:.08em;font-weight:700;margin-bottom:4px}
  .summary b{font-family:var(--title-font);font-size:1.6rem;color:var(--strong);font-weight:700;font-variant-numeric:tabular-nums}
  .summary b.in{color:var(--in)} .summary b.out{color:var(--out)}
  .summary b .unit{font-size:.8rem;margin-left:2px;font-family:var(--sans);color:var(--sub);font-weight:500}

  /* ---------- 달력 ---------- */
  .cal-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .cal-nav .ym{font-family:var(--title-font);font-size:1.3rem;color:var(--strong);font-weight:700}
  .cal-nav .ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .cal-nav input[type=month]{padding:4px 6px;border:1px solid var(--line);font-family:inherit;font-size:.85rem;background:var(--surface);color:var(--text)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cal .wd{text-align:left;font-size:.72rem;letter-spacing:.06em;color:var(--sub);padding:6px 8px;font-weight:700;
           border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
  .cal .day{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:5px 7px;cursor:pointer;
            display:flex;flex-direction:column;font-size:.78rem;overflow:hidden}
  .cal .day:hover{box-shadow:inset 0 0 0 2px var(--accent)}
  .cal .day.blank{background:var(--panel);cursor:default}
  .cal .day.blank:hover{box-shadow:none}
  .cal .day .d{font-weight:600;color:var(--sub);font-size:.8rem;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:-2px 0 2px -4px}
  .cal .day.today .d{background:var(--primary);color:var(--on-primary);border-radius:50%}
  .cal .day.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--accent)}
  .cal .amt{text-align:right;line-height:1.35;font-variant-numeric:tabular-nums;font-weight:600}
  .cal .amt .full{display:inline} .cal .amt .short{display:none}
  @media (max-width:600px){
    h1{font-size:1.5rem}
    .cal .amt .full{display:none} .cal .amt .short{display:inline}
    .cal .day{min-height:60px;padding:3px 4px}
    .cal .wd{padding:5px 4px}
    .summary{gap:6px}
    .summary div{padding:10px 8px}
    .summary b{font-size:1.05rem}
    .cell{min-height:84px}
    .section{padding:12px}
  }

  /* ---------- 모달 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(8,16,26,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal{background:var(--surface);color:var(--text);border-radius:10px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:0;
         box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .modal-head{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
  .modal-head .kicker{margin-bottom:4px}
  .modal h2{margin:0;font-family:var(--title-font);font-size:1.3rem;color:var(--strong);font-weight:700}
  .modal-body{padding:18px 22px 6px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .field > label{font-size:.72rem;letter-spacing:.08em;font-weight:700;color:var(--sub)}
  .field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:5px;font-size:.95rem;
         font-family:inherit;width:100%;background:var(--bg);color:var(--text)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent)}
  .field select:disabled,.field input:disabled,.field textarea:disabled{background:var(--panel);color:var(--sub)}
  .field textarea{min-height:64px;resize:vertical}
  .radios{display:flex;gap:22px;padding:4px 0}
  .radios label{display:flex;align-items:center;gap:6px;font-size:.95rem;cursor:pointer}
  .radios input{width:auto;margin:0;accent-color:var(--primary)}
  .fixed{padding:8px 10px;background:var(--panel);border:1px solid var(--line);color:var(--sub)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btns{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel);
        position:sticky;bottom:0}
  .btns .danger{margin-right:auto}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .thumb{position:relative;width:72px;height:72px;border:1px solid var(--line);overflow:hidden;cursor:pointer}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .x{position:absolute;top:0;right:0;background:var(--strong);color:var(--bg);border:0;width:22px;height:22px;cursor:pointer;padding:0}
  .viewer img{max-width:100%;display:block;margin:0 auto 10px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================================================================
// 0. Supabase 연결
//    Publishable key는 공개되어도 됨 (로그인 + RLS 권한으로 보호)
// =====================================================================
const SUPABASE_URL = 'https://fbzdcwjtctimnmakrsxq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A2wC8Z0S-QzkmjkywPh5zg_I_0_YogU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_KO = {admin:'관리자', manager:'관리인', viewer:'조회'};
let me = null;   // 로그인 사용자 {user_id, name, role, email}
const can = {
  get edit(){ return me?.role === 'admin' || me?.role === 'manager'; },   // 입력·수정
  get del(){ return me?.role === 'admin'; },                              // 삭제
  get admin(){ return me?.role === 'admin'; }                             // 관리자 메뉴
};

// =====================================================================
// 1. 기준정보
// =====================================================================
const ROOMS = [
  {no:'201', floor:2, type:'원룸'},   {no:'202', floor:2, type:'원룸'},
  {no:'203', floor:2, type:'투룸'},   {no:'205', floor:2, type:'미니투룸'},
  {no:'301', floor:3, type:'원룸'},   {no:'302', floor:3, type:'원룸'},
  {no:'303', floor:3, type:'투룸'},   {no:'305', floor:3, type:'미니투룸'},
  {no:'501', floor:4, type:'원룸'},   {no:'502', floor:4, type:'원룸'},
  {no:'503', floor:4, type:'투룸'},   {no:'505', floor:4, type:'미니투룸'}
];
const COMMON = '공용';
const DEFAULT_LISTS = {
  option:['냉장고','세탁기','에어컨','침대','책상','의자','옷장','전자렌지','TV','가스렌지'],
  repair:['공실청소','도배','전등교체','수전교체','세탁기수리','공실전기','기타'],
  common:['관리비','공용전기','인터넷','수도료','지방세','기타'],
  etc:['중개수수료','소모품','기타']
};
const TYPE_LIST = {'옵션':'option', '수리':'repair', '기타':'etc', '공용':'common'};   // 출금 구분 → 내역 목록
const MAX_TENANTS = 2;   // 호실당 최대 임차인 수
const REPAIR_VIEW = 10;  // 수리현황 표시 건수
const PHOTO_BUCKET = 'contracts';

// =====================================================================
// 2. 데이터 (Supabase DB ↔ 화면용 db 객체)
//    db = { rooms:{'201':{tenants:[]}}, exTenants:[], ledger:[], lists:{option,repair,common,etc} }
//    ledger 항목 e = {id(uuid), no(처리번호), date, room('공용'|호실), dir('입금'|'출금'),
//                     type('입금'|'이월'|'옵션'|'수리'|'기타'|'공용'), item, amount, memo, updated_at}
//    tenant t = {id, room, name, phone, deposit, rent, payDay, start, end, memo, moveOut, photos:[{id,path}], updated_at}
// =====================================================================
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : uid() + uid();

function newTenant(v){ return {id:null, name:'', phone:'', deposit:0, rent:0, payDay:'', start:'', end:'', memo:'', photos:[], ...v}; }
const depRent = t => (t.deposit || t.rent) ? `${fmt(Math.round((t.deposit || 0) / 10000))}/${fmt(Math.round((t.rent || 0) / 10000))}` : '';
function emptyDB(){
  const rooms = {};
  ROOMS.forEach(r => rooms[r.no] = {tenants:[]});
  return {rooms, exTenants:[], ledger:[], lists:structuredClone(DEFAULT_LISTS)};
}
let db = emptyDB();

// ----- DB 행 ↔ 화면 객체 변환 -----
const fromLedger = r => ({id:r.id, no:r.doc_no || '', date:r.tx_date, room:r.room_no || COMMON, dir:r.io, type:r.category,
                          item:r.item || '', amount:Number(r.amount), memo:r.memo || '', updated_at:r.updated_at});
const toLedger = e => ({doc_no:e.no, tx_date:e.date, room_no:e.room === COMMON ? null : e.room, io:e.dir, category:e.type,
                        item:e.item || null, amount:e.amount, memo:e.memo || null, rent_month:rentMonth(e)});
const fromTenant = (r, photos) => ({id:r.id, room:r.room_no, name:r.name, phone:r.phone || '', deposit:Number(r.deposit), rent:Number(r.rent),
                          payDay:r.pay_day || '', start:r.start_date || '', end:r.end_date || '', memo:r.memo || '',
                          status:r.status, moveOut:r.move_out_date || '', photos, updated_at:r.updated_at});
const toTenant = t => ({room_no:t.room, name:t.name, phone:t.phone || null, deposit:t.deposit || 0, rent:t.rent || 0, pay_day:t.payDay || null,
                        start_date:t.start || null, end_date:t.end || null, memo:t.memo || null});
// 월세 귀속월: 입금 내역 "9월 월세" → 2026-09-01 (납부현황표용)
function rentMonth(e){
  if(e.dir !== '입금') return null;
  const m = /(\d{1,2})\s*월\s*월세/.exec(e.item || '');
  if(!m) return null;
  const mm = Number(m[1]); if(mm < 1 || mm > 12) return null;
  let y = Number(e.date.slice(0,4)); const dm = Number(e.date.slice(5,7));
  if(mm - dm > 6) y--; else if(dm - mm > 6) y++;
  return `${y}-${String(mm).padStart(2,'0')}-01`;
}

// ----- 오류 처리 -----
class DbError extends Error {}
const CONFLICT_MSG = '저장되지 않았습니다.\n다른 사용자가 먼저 수정·삭제했거나 권한이 없습니다.\n최신 내용으로 다시 불러왔으니 확인 후 다시 입력하세요.';
function errText(e){
  const m = e?.message || String(e);
  if(e?.code === '42501' || /row-level security|permission denied/i.test(m)) return '권한이 없습니다.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인하세요.';
  return m;
}
// Supabase 호출 결과 확인: 오류면 알림 후 DbError
async function q(p, what = '처리'){
  const {data, error} = await p;
  if(error){ await uiAlert(`${what} 실패\n${errText(error)}`); throw new DbError(error.message); }

}

// ----- 전체 불러오기 (1,000건 단위로 나눠 읽음) -----
async function fetchAll(table, cols, orders){
  const out = [];
  for(let from = 0; ; from += 1000){
    let qb = sb.from(table).select(cols);
    orders.forEach(o => qb = qb.order(o));
    const d = await q(qb.range(from, from + 999), '불러오기');
    out.push(...d);
    if(d.length < 1000) return out;
  }
}
async function loadAll(){
  const [L, T, P, I] = await Promise.all([
    fetchAll('ledger', 'id,doc_no,tx_date,io,category,item,amount,room_no,memo,updated_at', ['tx_date','id']),
    fetchAll('tenants', '*', ['created_at','id']),
    fetchAll('tenant_photos', 'id,tenant_id,path', ['created_at','id']),
    fetchAll('item_lists', 'kind,name', ['sort_order','name'])
  ]);
  const d = emptyDB(), ph = new Map();
  P.forEach(p => { if(!ph.has(p.tenant_id)) ph.set(p.tenant_id, []); ph.get(p.tenant_id).push({id:p.id, path:p.path}); });
  T.forEach(r => {
    const t = fromTenant(r, ph.get(r.id) || []);
    if(r.status === '퇴실') d.exTenants.push(t); else d.rooms[r.room_no]?.tenants.push(t);
  });
  d.ledger = L.map(fromLedger);
  const got = {};
  I.forEach(x => (got[x.kind] ??= []).push(x.name));
  for(const k in d.lists) if(got[k]?.length) d.lists[k] = got[k];
  db = d;
}

// ----- 처리번호: YYYYMMDD-001 (날짜별 전체 일련번호) -----
function newId(date){
  const p = date.replaceAll('-','') + '-';
  let max = 0;
  for(const x of db.ledger) if(x.no.startsWith(p)) max = Math.max(max, Number(x.no.slice(p.length)) || 0);
  return p + String(max + 1).padStart(3,'0');
}
// ----- 이월 기준일: '이월' 항목의 날짜 (없으면 null) -----
//   기준일 당일 및 이전 날짜의 옵션·수리 등은 '이월 전 이력' → 호실 이력에는 보이지만 잔액·합계에는 반영 안 함
function cutoffDate(){
  let d = null;
  for(const e of db.ledger) if(e.type === '이월' && (!d || e.date > d)) d = e.date;
  return d;
}
function isHist(e, cut = cutoffDate()){ return !!cut && e.type !== '이월' && e.date <= cut; }
const cashList = () => { const c = cutoffDate(); return db.ledger.filter(e => !isHist(e, c)); };
function balances(){
  const m = new Map(); let bal = 0;
  cashList().sort(byDateAsc).forEach(e => { bal += e.dir === '입금' ? e.amount : -e.amount; m.set(e.id, bal); });
  return {map:m, last:bal};
}

// ----- 저장: 금전출납부 -----
async function saveLedger(rec, entry){
  for(let tryNo = 0; tryNo < 2; tryNo++){
    const no = (!rec || rec.date !== entry.date) ? newId(entry.date) : rec.no;
    const row = toLedger({...entry, no});
    const res = rec
      ? await sb.from('ledger').update(row).eq('id', rec.id).eq('updated_at', rec.updated_at).select('id')
      : await sb.from('ledger').insert(row).select('id');
    if(res.error?.code === '23505' && tryNo === 0){ await loadAll(); continue; }   // 처리번호 동시 사용 → 새 번호로 재시도
    if(res.error){ await uiAlert('저장 실패\n' + errText(res.error)); throw new DbError(res.error.message); }
    if(rec && !res.data.length) return conflict();
    return;
  }
}
async function deleteLedger(rec){
  const d = await q(sb.from('ledger').delete().eq('id', rec.id).select('id'), '삭제');
  if(!d.length) return conflict();
}
// ----- 저장: 임차인 + 계약서 사진 -----
async function saveTenant(cur, vals, photos, removed){
  let id = cur.id;
  if(!id){
    id = (await q(sb.from('tenants').insert(toTenant(vals)).select('id').single(), '임차인 등록')).id;
  }else{
    const d = await q(sb.from('tenants').update(toTenant(vals)).eq('id', id).eq('updated_at', cur.updated_at).select('id'), '임차인 저장');
    if(!d.length) return conflict();
  }
  for(const p of photos) if(p.blob){
    const path = `${id}/${uuid()}.jpg`;
    await q(sb.storage.from(PHOTO_BUCKET).upload(path, p.blob, {contentType:'image/jpeg'}), '사진 올리기');
    await q(sb.from('tenant_photos').insert({tenant_id:id, path}), '사진 저장');
  }
  for(const p of removed){
    await q(sb.from('tenant_photos').delete().eq('id', p.id), '사진 삭제');
    await q(sb.storage.from(PHOTO_BUCKET).remove([p.path]), '사진 파일 삭제');
  }
}
async function moveOutTenant(cur, date){
  const d = await q(sb.from('tenants').update({status:'퇴실', move_out_date:date})
                      .eq('id', cur.id).eq('updated_at', cur.updated_at).select('id'), '퇴실 처리');

// ----- 계약서 사진 -----
async function photoBlob(p){
  if(p.blob) return p.blob;
  const {data} = await sb.storage.from(PHOTO_BUCKET).download(p.path);
  return data || null;
}
function compressImage(file, max = 1400, qual = 0.75){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('사진 변환 실패')), 'image/jpeg', qual);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없습니다: ' + file.name)); };
    img.src = url;
  });
}

// ----- 앱 자체 확인창 (일부 휴대폰 앱 내 브라우저는 confirm/prompt/alert를 막음) -----
function uiDialog({title = '확인', msg = '', input = null, okText = '확인', cancel = true, danger = false}){
  return new Promise(res => {
    const ov = el('div','overlay top'), m = el('div','modal dialog'), bar = el('div','btns');
    const head = el('div','modal-head'), body = el('div','modal-body');
    head.append(el('h2', null, title));
    body.append(el('div','dlg-msg', msg));
    let f = null;
    if(input){ f = inp(input.type || 'text', input.value ?? ''); f.className = 'dlg-input'; body.append(f); }
    const done = v => { ov.remove(); document.removeEventListener('keydown', key); res(v); };
    const key = e => { if(e.key === 'Escape') done(cancel ? (input ? null : false) : true); if(e.key === 'Enter' && e.target === f) ok.click(); };
    if(cancel) bar.append(btn('취소', '', () => done(input ? null : false)));
    const ok = btn(okText, danger ? 'danger' : 'primary', () => done(input ? f.value : true));
    bar.append(ok);
    m.append(head, body, bar); ov.append(m); document.body.append(ov);
    document.addEventListener('keydown', key);
    setTimeout(() => (f || ok).focus(), 0);
  });
}
const uiAlert   = (msg, title = '알림') => uiDialog({title, msg, cancel:false});
const uiConfirm = (msg, {title = '확인', okText = '확인', danger = false} = {}) => uiDialog({title, msg, okText, danger});
const uiPrompt  = (msg, value = '', type = 'text', title = '입력') => uiDialog({title, msg, input:{type, value}});

function field(label, input){ const f = el('div','field'); f.append(el('label', null, label), input); return f; }
function inp(type, val, attrs = {}){
  const i = document.createElement(type === 'textarea' ? 'textarea' : 'input');
  if(type !== 'textarea') i.type = type;
  if(type !== 'file') i.value = val ?? '';
  Object.assign(i, attrs); return i;
}
function moneyInput(val){
  const i = inp('text', val ? fmt(val) : '', {inputMode:'numeric', placeholder:'0'});
  i.oninput = () => { const n = toNum(i.value); i.value = n ? fmt(n) : ''; };
  return i;
}
function radios(values, cur){
  const name = 'r' + uid(), box = el('div','radios'), api = {box, onchange:null};
  const inputs = values.map(v => {
    const l = el('label'), r = inp('radio', v, {name, checked:v === cur});
    r.onchange = () => api.onchange?.();
    l.append(r, document.createTextNode(v)); box.append(l); return r;
  });
  Object.defineProperty(api, 'value', {
    get:() => inputs.find(r => r.checked)?.value ?? '',
    set:v => inputs.forEach(r => r.checked = r.value === v)
  });
  api.disable = on => inputs.forEach(r => r.disabled = on);
  return api;
}

// =====================================================================
// 5-1. 백업 내보내기 / 백업 → DB 이관
//   · 내보내기: 기존 앱과 같은 JSON 형식 (계약서 사진 제외)
//   · 이관(관리자): JSON 백업으로 DB의 출납부·임차인·항목목록 전체를 교체
// =====================================================================
function exportBackup(){
  const rooms = {};
  const strip = t => ({id:t.id, name:t.name, phone:t.phone, deposit:t.deposit, rent:t.rent, payDay:t.payDay, start:t.start, end:t.end, memo:t.memo, photos:[]});
  ROOMS.forEach(r => rooms[r.no] = {tenants:db.rooms[r.no].tenants.map(strip)});
  const out = {
    v:3, rooms,
    exTenants:db.exTenants.map(t => ({...strip(t), room:t.room, moveOut:t.moveOut})),
    ledger:[...db.ledger].sort(byDateAsc).map(e => ({id:e.no, date:e.date, room:e.room, dir:e.dir, type:e.type, item:e.item, amount:e.amount, memo:e.memo})),
    lists:db.lists
  };
  const data = {app:'newgenvill2', kind:'backup', exported:new Date().toISOString(), db:out};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:'application/json'}));
  a.download = `뉴젠빌2_백업_${today().replaceAll('-','')}.json`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importBackup(){
  if(!can.admin) return;
  const f = inp('file', '', {accept:'.json,application/json'});
  f.style.display = 'none'; document.body.append(f);
  f.onchange = async () => {
    f.remove();
    let d;
    try{ d = JSON.parse(await f.files[0].text()); }catch(e){ uiAlert('파일을 읽을 수 없습니다.'); return; }
    if(d?.app !== 'newgenvill2' || d.kind !== 'backup' || !d.db){ uiAlert('뉴젠빌2 백업 파일이 아닙니다.'); return; }
    const src = d.db;
    const tenants = [];
    for(const [no, r] of Object.entries(src.rooms || {}))
      (r.tenants || []).forEach(t => tenants.push({...toTenant({...t, room:no}), status:'거주'}));
    (src.exTenants || []).forEach(t => tenants.push({...toTenant(t), status:'퇴실', move_out_date:t.moveOut || null}));
    const ledger = (src.ledger || []).map(e => toLedger({...e, no:e.id, room:e.room || COMMON}));
    const lists = [];
    for(const [kind, names] of Object.entries(src.lists || {}))
      if(DEFAULT_LISTS[kind]) [...new Set(names)].forEach((name, i) => lists.push({kind, name, sort_order:i}));
    const carry = (src.ledger || []).filter(e => e.type === '이월').sort((a, b) => b.date.localeCompare(a.date))[0];

    if(!await uiConfirm(
      `백업 파일 (${(d.exported || '').slice(0,10)})\n임차인 ${tenants.length}명 · 출납부 ${ledger.length}건 · 항목 ${lists.length}개\n\n` +
      `DB의 출납부·임차인·항목목록을 모두 지우고 이 자료로 교체합니다.\n(지운 내용은 변경 이력에 남습니다)\n계속할까요?`,
      {title:'백업 → DB 이관', okText:'이관 실행', danger:true})) return;

    const wait = el('div','dlg-msg','이관 중입니다… 창을 닫지 마세요.');
    const ov = el('div','overlay top'), m = el('div','modal dialog'), b = el('div','modal-body');
    b.append(wait); m.append(b); ov.append(m); document.body.append(ov);
    try{
      await q(sb.from('ledger').delete().not('id', 'is', null), '출납부 비우기');
      await q(sb.from('tenants').delete().not('id', 'is', null), '임차인 비우기');
      await q(sb.from('item_lists').delete().not('kind', 'is', null), '항목목록 비우기');
      for(let i = 0; i < tenants.length; i += 500) await q(sb.from('tenants').insert(tenants.slice(i, i + 500)), '임차인 이관');
      for(let i = 0; i < ledger.length;  i += 500) await q(sb.from('ledger').insert(ledger.slice(i, i + 500)), '출납부 이관');
      if(lists.length) await q(sb.from('item_lists').insert(lists), '항목목록 이관');
      if(carry) await q(sb.from('app_settings').update({carryover_date:carry.date, opening_balance:carry.amount}).eq('id', 1), '이월잔액 설정');
      await loadAll();
      ov.remove(); router();
      uiAlert(`이관 완료\n임차인 ${tenants.length}명 · 출납부 ${ledger.length}건 · 항목 ${lists.length}개`);
    }catch(e){
      ov.remove();
      if(!(e instanceof DbError)) uiAlert('이관 실패\n' + errText(e));
      try{ await loadAll(); router(); }catch(x){}
    }
  };
  f.click();
}
function expCls(end){
  if(!end) return '';
  const days = (new Date(end) - new Date(today())) / 86400000;
  return days < 0 ? 'expired' : days <= 90 ? 'soon' : '';
}

// ----- [임차인정보] 모달 -----
function openTenantModal(no, t){
  const isNew = !t, cur = t || newTenant({start:today()});
  const fName = inp('text', cur.name), fPhone = inp('tel', cur.phone, {placeholder:'010-0000-0000'});
  const fStart = inp('date', cur.start), fEnd = inp('date', cur.end), fMemo = inp('textarea', cur.memo);
  const fDep = moneyInput(cur.deposit), fRent = moneyInput(cur.rent);
  const fPay = inp('text', cur.payDay, {placeholder:'예: 10일 / 사글세'});
  fPay.setAttribute('list', 'payDayList');

  // 사진 편집 상태 (저장 버튼을 눌러야 실제 반영)
  const photos = cur.photos.map(p => ({...p})), removed = [], urls = [];
  const thumbs = el('div','thumbs');
  const fFile = inp('file', '', {accept:'image/*', multiple:true});
  async function drawThumbs(){
    thumbs.innerHTML = '';
    for(const p of photos){
      if(!p.url){
        const b = await photoBlob(p).catch(() => null);
        if(!b) continue;
        p.url = URL.createObjectURL(b); urls.push(p.url);
      }
      const d = el('div','thumb'), img = el('img');
      img.src = p.url; img.onclick = () => window.open(p.url);
      d.append(img);
      if(p.blob || can.del){   // 새로 고른 사진은 누구나, 저장된 사진 삭제는 관리자만
        const x = el('button','x','×'); x.type = 'button';
        x.onclick = () => { photos.splice(photos.indexOf(p), 1); if(!p.blob) removed.push(p); drawThumbs(); };
        d.append(x);
      }
      thumbs.append(d);
    }
    if(!photos.length && !can.edit) thumbs.append(el('div','note','사진 없음'));
  }
  fFile.onchange = async () => {
    for(const f of fFile.files){
      try{ photos.push({blob:await compressImage(f)}); }catch(e){ uiAlert(e.message); }
    }
    fFile.value = ''; drawThumbs();
  };
  drawThumbs();

  const two = el('div','two'); two.append(field('임대시작일', fStart), field('임대종료일', fEnd));
  const photoBox = el('div'); photoBox.append(thumbs); if(can.edit) photoBox.append(fFile);
  const body = el('div');
  const money = el('div','two'); money.append(field('보증금(원)', fDep), field('월세(원) · 사글세는 선납액', fRent));
  const dl = document.createElement('datalist'); dl.id = 'payDayList';
  ['사글세', ...Array.from({length:31}, (_, i) => (i + 1) + '일')].forEach(v => dl.append(new Option(v)));
  body.append(field('이름 *', fName), field('전화번호', fPhone), money, field('월세 납부일', fPay), dl, two, field('기타사항', fMemo), field('계약서 사진', photoBox));
  if(!can.edit) body.querySelectorAll('input,textarea').forEach(x => x.disabled = true);

  const cleanup = () => urls.forEach(u => URL.revokeObjectURL(u));
  const buttons = [];
  if(!can.edit){
    buttons.push({text:'닫기', onClick:close => close()});
  }else{
    if(!isNew) buttons.push({text:'퇴실', cls:'danger', onClick:async close => {
      const d = await uiPrompt('퇴실일을 선택하세요', today(), 'date', '퇴실 처리');
      if(d === null) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ uiAlert('날짜 형식이 올바르지 않습니다.'); return; }
      if(!await uiConfirm(`${cur.name} 님을 퇴실 처리합니다.\n정보는 퇴실자 목록으로 이동합니다.`)) return;
      await moveOutTenant(cur, d);
      await afterSave(close);
    }});
    buttons.push({text:'취소', onClick:close => close()});
    buttons.push({text:'저장', cls:'primary', onClick:async close => {
      const name = fName.value.trim();
      if(!name){ uiAlert('이름을 입력하세요.'); return; }
      if(fStart.value && fEnd.value && fEnd.value < fStart.value){ uiAlert('종료일이 시작일보다 빠릅니다.'); return; }
      if(isNew && db.rooms[no].tenants.length >= MAX_TENANTS){ uiAlert(`호실당 임차인은 최대 ${MAX_TENANTS}명입니다.`); return; }
      const vals = {room:no, name, phone:fPhone.value.trim(), deposit:toNum(fDep.value), rent:toNum(fRent.value), payDay:fPay.value.trim(),
                    start:fStart.value, end:fEnd.value, memo:fMemo.value.trim()};
      await saveTenant(cur, vals, photos, removed);
      await afterSave(close);
    }});
  }
  openModal(isNew ? '임차인 등록' : '임차인정보', body, buttons, cleanup, `${no}호`);
}

// =====================================================================
// 7. [입출금항목] 모달 — 금전출납부 / 호실 옵션·수리 공용
//    rec: 수정할 항목(없으면 신규), lock: {room, dir, type} 고정값, preset: 기본값
// =====================================================================
function openLedgerModal(rec, lock = null, preset = {}){
  const isNew = !rec;
  const cur = rec || {date:preset.date || today(), room:lock?.room || COMMON, dir:lock?.dir || '출금',
                      type:lock?.type || '', item:preset.item || '', amount:preset.amount || 0, memo:preset.memo || ''};

  const fDate = inp('date', cur.date);
  const fRoom = document.createElement('select');
  [COMMON, ...ROOMS.map(r => r.no)].forEach(v => fRoom.append(new Option(roomLabel(v), v)));
  fRoom.value = cur.room;
  const fDir  = radios(['입금','출금'], cur.dir);
  const fType = radios(['옵션','수리','기타'], ['수리','기타'].includes(cur.type) ? cur.type : '옵션');
  const fItemSel = itemSelect();
  const fItemTxt = inp('text', cur.dir === '입금' ? cur.item : '', {placeholder:'예: 9월 월세 (선택)'});
  const fAmt  = moneyInput(cur.amount);
  const fMemo = inp('textarea', cur.memo);
  if(lock){ fRoom.disabled = true; fDir.disable(true); fType.disable(true); }

  const commonType = el('div','fixed','공용');
  const typeField = el('div','field'); typeField.append(el('label', null, '구분'));
  const itemField = el('div','field'); itemField.append(el('label', null, '내역'));

  let prevKind = null;
  function refresh(){
    const isOut = fDir.value === '출금', isCommon = fRoom.value === COMMON;
    typeField.style.display = isOut ? '' : 'none';
    typeField.replaceChildren(typeField.firstChild, isCommon ? commonType : fType.box);
    itemField.replaceChildren(itemField.firstChild, isOut ? fItemSel : fItemTxt);
    if(isOut){
      const kind = TYPE_LIST[isCommon ? '공용' : fType.value];
      if(kind !== prevKind){ fItemSel.load(kind, prevKind === null ? cur.item : ''); prevKind = kind; }
    }
  }
  fRoom.onchange = refresh; fDir.onchange = refresh; fType.onchange = refresh;
  refresh();

  const body = el('div');
  const row1 = el('div','two'); row1.append(field('날짜', fDate), field('호실', fRoom));
  const histNote = el('div','hist-note');
  const cut = cutoffDate();
  const updHist = () => {
    const on = cut && fDate.value && fDate.value <= cut && cur.type !== '이월';
    histNote.style.display = on ? '' : 'none';
    histNote.textContent = on ? `이월 기준일(${cut}) 이전 자료입니다. 호실 이력에는 기록되지만 금전출납부 잔액에는 반영되지 않습니다.` : '';
  };
  fDate.addEventListener('input', updHist); fDate.addEventListener('change', updHist); updHist();
  body.append(row1, histNote, field('입금 / 출금', fDir.box), typeField, itemField, field('금액(원)', fAmt), field('비고', fMemo));
  if(!can.edit){
    body.querySelectorAll('input,select,textarea').forEach(x => x.disabled = true);
    fDir.disable(true); fType.disable(true);
  }

  const buttons = [];
  if(!isNew && can.del) buttons.push({text:'삭제', cls:'danger', onClick:async close => {
    if(!await uiConfirm(`${rec.no}  ${rec.date}  ${roomLabel(rec.room)}\n${rec.item || rec.type}  ${fmt(rec.amount)}원\n\n이 내역을 삭제합니다.`, {title:'삭제 확인', okText:'삭제', danger:true})) return;
    await deleteLedger(rec);
    await afterSave(close);
  }});
  if(!can.edit) buttons.push({text:'닫기', onClick:close => close()});
  else{
    buttons.push({text:'취소', onClick:close => close()});
    buttons.push({text:'저장', cls:'primary', onClick:async close => {
      const date = fDate.value, room = fRoom.value, dir = fDir.value, amount = toNum(fAmt.value);
      if(!date){ uiAlert('날짜를 입력하세요.'); return; }
      if(!amount){ uiAlert('금액을 입력하세요.'); return; }
      let type, item;
      if(dir === '입금'){ type = cur.type === '이월' ? '이월' : '입금'; item = fItemTxt.value.trim(); }
      else{
        type = room === COMMON ? '공용' : fType.value;
        item = fItemSel.value;
        if(!item || item === '__add__'){ uiAlert('내역을 선택하세요.'); return; }
      }
      await saveLedger(rec, {date, room, dir, type, item, amount, memo:fMemo.value.trim()});
      await afterSave(close);
    }});
  }

  const title = lock?.type === '입금' ? '월세 입금' : lock?.type ? `${lock.type}항목` : '입출금항목';
  const kicker = (lock ? roomLabel(cur.room) + ' · ' : '금전출납부 · ') + (isNew ? '신규' : rec.no);
  openModal(title, body, buttons, null, kicker);
}

// 8. 공용 관리현황 (금전출납부 / 달력)
// =====================================================================
const ui = {view:'ledger', ym:today().slice(0,7), selDate:null, showHist:false, stale:false};
try{ ui.view = localStorage.getItem('newgenvill2_view') || 'ledger'; }catch(e){}

function renderCommon(){
  $app.innerHTML = '';
  pageHeader('<공용 관리현황>', '입출금 관리', `전체 ${db.ledger.length}건 · 금전출납부와 달력으로 조회`);
  const tg = el('div','toggle');
  [['ledger','금전출납부'],['cal','달력']].forEach(([k, t]) => {
    const b = el('button', ui.view === k ? 'on' : '', t); b.type = 'button';
    b.onclick = () => { ui.view = k; try{ localStorage.setItem('newgenvill2_view', k); }catch(e){} renderCommon(); };
    tg.append(b);
  });
  $app.append(tg);
  if(ui.view === 'cal') renderCalendar(); else renderLedger();
}
function kpiRow(items){
  const s = el('div','summary');
  items.forEach(([t, v, unit, c]) => {
    const d = el('div'), b = el('b', c || null, v); b.append(el('span','unit', unit)); d.append(el('small', null, t), b); s.append(d);
  });
  return s;
}
function monthSums(ym){
  let i = 0, o = 0, h = 0;
  for(const e of db.ledger){
    if(!e.date.startsWith(ym) || e.type === '이월') continue;
    if(isHist(e)) h++;
    if(e.dir === '입금') i += e.amount; else o += e.amount;
  }
  return {in:i, out:o, hist:h};
}
function balanceToday(){
  const td = today(); let b = 0;
  for(const e of cashList()) if(e.date <= td) b += e.dir === '입금' ? e.amount : -e.amount;
  return b;
}
function monthSummary(ym){
  const m = Number(ym.slice(5)), y = ym.slice(0,4), sm = monthSums(ym), td = today();
  const lbl = (y === td.slice(0,4) ? '' : `${y}년 `) + `${m}월`;
  const row = kpiRow([[`${lbl} 입금`, fmt(sm.in), '원', 'in'], [`${lbl} 출금`, fmt(sm.out), '원', 'out'],
                      [`현재 잔액 · ${Number(td.slice(5,7))}/${Number(td.slice(8))} 기준`, fmt(balanceToday()), '원']]);
  if(sm.hist) row.querySelectorAll('div')[1].append(el('small','kpi-note', `이월 전 이력 ${sm.hist}건 포함`));
  return row;
}

// ----- 8-1. 금전출납부 보기 -----
function renderLedger(){
  const {map} = balances();
  const cut = cutoffDate();
  const cash = cashList();
  const histCnt = db.ledger.length - cash.length;
  const list = (ui.showHist ? [...db.ledger] : cash).sort(byDateDesc);
  $app.append(monthSummary(today().slice(0,7)));

  const opt = el('label','histopt');
  const cb = inp('checkbox', '', {checked:!!ui.showHist});
  cb.onchange = () => { ui.showHist = cb.checked; renderCommon(); };
  opt.append(cb, document.createTextNode(` 이월 전 이력 포함 (${histCnt}건)`));
  const s = section('입출금 내역', histCnt ? opt : el('span','note','최신순'));
  if(cut) s.append(el('div','note', `이월 기준일 ${cut} · 이 날짜 이전(당일 포함)의 옵션·수리 이력은 잔액과 합계에 반영되지 않습니다.`));
  const add = addBtn('추가', () => openLedgerModal(null));
  const headers = ['처리번호','날짜','호실','구분','입금액','출금액','내역','비고','잔액', add];
  if(!list.length){
    s.append(table(headers, []), el('div','empty', can.edit ? '입출금 내역이 없습니다. [추가]를 눌러 입력하세요.' : '입출금 내역이 없습니다.'));
  }else{
    s.append(table(headers, list.map(e => { const h = isHist(e, cut); return [
      e.no, h ? histDate(e.date) : e.date, roomLabel(e.room), e.type,
      {v:e.dir === '입금' ? fmt(e.amount) : '', cls:'num ' + (h ? 'histamt' : 'in')},
      {v:e.dir === '출금' ? fmt(e.amount) : '', cls:'num ' + (h ? 'histamt' : 'out')},
      e.item, {v:e.memo, cls:'memo'},
      {v:h ? '미반영' : fmt(map.get(e.id)), cls:'num ' + (h ? 'histamt' : 'bal')},
      btn(editLabel(),'small edit', () => openLedgerModal(e))
    ]; }), i => openLedgerModal(list[i])));
  }
  $app.append(s);
}

// ----- 8-2. 달력 보기 -----
function renderCalendar(){
  const [y, m] = ui.ym.split('-').map(Number);
  const ym = ui.ym, first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
  const byDay = {}, cut = cutoffDate();
  let histCnt = 0;
  for(const e of db.ledger){
    if(!e.date.startsWith(ym)) continue;
    const d = byDay[e.date] ??= {in:0, out:0, hIn:0, hOut:0};
    if(isHist(e, cut)){
      histCnt++;
      if(e.dir === '입금') d.hIn += e.amount; else d.hOut += e.amount;
    }else if(e.dir === '입금') d.in += e.amount; else d.out += e.amount;
  }
  $app.append(monthSummary(ym));

  const s = el('div','section');
  const nav = el('div','cal-nav');
  const move = k => { const d = new Date(y, m - 1 + k, 1); ui.ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; ui.selDate = null; renderCommon(); };
  const ymInput = inp('month', ym);
  ymInput.onchange = () => { if(ymInput.value){ ui.ym = ymInput.value; ui.selDate = null; renderCommon(); } };
  const ctrl = el('div','ctrl');
  ctrl.append(btn('◀','small edit', () => move(-1)), btn('▶','small edit', () => move(1)),
              btn('오늘','small', () => { ui.ym = today().slice(0,7); ui.selDate = today(); renderCommon(); }), ymInput);
  nav.append(el('span','ym', `${y}년 ${m}월`), ctrl);
  s.append(nav);

  const cal = el('div','cal'), td = today();
  ['일','월','화','수','목','금','토'].forEach(w => cal.append(el('div','wd', w)));
  for(let i = 0; i < first.getDay(); i++) cal.append(el('div','day blank'));
  for(let d = 1; d <= days; d++){
    const ds = `${ym}-${String(d).padStart(2,'0')}`, v = byDay[ds];
    const c = el('div', 'day' + (ds === td ? ' today' : '') + (ds === ui.selDate ? ' sel' : ''));
    c.append(el('span','d', d));
    if(v?.in)  c.append(amtEl(v.in, 'in'));
    if(v?.out) c.append(amtEl(v.out, 'out'));
    if(v?.hIn)  c.append(amtEl(v.hIn, 'hist'));
    if(v?.hOut) c.append(amtEl(v.hOut, 'hist'));
    c.onclick = () => { ui.selDate = ds; renderCommon(); };
    cal.append(c);
  }
  s.append(cal);
  const lg = el('div','cal-legend');
  lg.append(el('span','in','■ 입금'), el('span','out','■ 출금'), el('span','hist-c','■ 이월 전 이력 (잔액 미반영)'));
  if(histCnt) lg.append(el('span', null, `· 이번 달 이력 ${histCnt}건`));
  s.append(lg);
  $app.append(s);

  if(ui.selDate && ui.selDate.startsWith(ym)){
    const list = db.ledger.filter(e => e.date === ui.selDate).sort(byDateAsc);
    const ds = section(`${ui.selDate} 내역`, addBtn('+ 이 날짜로 추가', () => openLedgerModal(null, null, {date:ui.selDate})));
    if(!list.length) ds.append(el('div','empty','내역이 없습니다.'));
    else ds.append(table(['처리번호','호실','구분','입금액','출금액','내역','비고',''], list.map(e => [
      e.no, roomLabel(e.room), isHist(e) ? histDate(e.type) : e.type,
      {v:e.dir === '입금' ? fmt(e.amount) : '', cls:'num ' + (isHist(e) ? 'histamt' : 'in')},
      {v:e.dir === '출금' ? fmt(e.amount) : '', cls:'num ' + (isHist(e) ? 'histamt' : 'out')},
      e.item, {v:e.memo, cls:'memo'}, btn(editLabel(),'small edit', () => openLedgerModal(e))
    ]), i => openLedgerModal(list[i])));
    $app.append(ds);
  }
}
function amtEl(n, cls){
  const a = el('div', 'amt ' + cls);
  a.append(el('span','full', fmt(n)), el('span','short', fmtMan(n)));
  return a;
}

// 9. 퇴실자 목록

function renderExTenants(){
  $app.innerHTML = '';
  pageHeader('<퇴실자 목록>', '임차인 이력', `퇴실 ${db.exTenants.length}명 · 퇴실일 최신순`);
  const xs = [...db.exTenants].sort((a,b) => (b.moveOut || '').localeCompare(a.moveOut || ''));
  const s = el('div','section');
  if(!xs.length) s.append(el('div','empty','퇴실자가 없습니다.'));
  else s.append(table(['호실','이름','전화번호','시작일','종료일','퇴실일','기타사항','계약서'],
    xs.map(t => [t.room + '호', t.name, phoneLink(t.phone), t.start, t.end, t.moveOut, {v:t.memo, cls:'memo'},
                 t.photos.length ? linkBtn(`사진 ${t.photos.length}장`, () => showPhotos(t.photos)) : '-'])));

// =====================================================================
// 10. 관리자: 사용자 관리 / 변경 이력
// =====================================================================
async function renderUsers(){
  $app.innerHTML = '';
  pageHeader('<사용자 관리>', '관리자', '새 계정은 Supabase 대시보드 → Authentication → Users → Add user 에서 만듭니다. (처음엔 조회 권한)');
  const s = el('div','section'); s.append(el('div','empty','불러오는 중…')); $app.append(s);
  let rows;
  try{ rows = await q(sb.from('profiles').select('*').order('created_at'), '사용자 조회'); }catch(e){ return; }
  if(location.hash !== '#/users') return;
  s.innerHTML = '';
  s.append(table(['이름','이메일','권한','사용','등록일'], rows.map(p => {
    const self = p.user_id === me.user_id;
    const save = async patch => {
      try{ await q(sb.from('profiles').update(patch).eq('user_id', p.user_id).select('user_id'), '사용자 변경'); }
      catch(e){ renderUsers(); }
    };
    const fName = inp('text', p.name); fName.className = 'tbl-input';
    fName.onchange = async () => { const n = fName.value.trim(); if(!n) return; await save({name:n}); if(self) me.name = n; };
    const fRole = document.createElement('select'); fRole.className = 'tbl-input';
    Object.entries(ROLE_KO).forEach(([k, v]) => fRole.append(new Option(v, k)));
    fRole.value = p.role; fRole.disabled = self;
    fRole.onchange = () => save({role:fRole.value});
    const fAct = inp('checkbox', '', {checked:p.active, disabled:self});
    fAct.onchange = () => save({active:fAct.checked});
    return [fName, p.email || '', fRole, fAct, (p.created_at || '').slice(0,10)];
  })));
  s.append(el('div','note','관리자: 전체 · 관리인: 조회·입력·수정 (삭제 불가) · 조회: 보기만. 본인 계정의 권한과 사용 여부는 바꿀 수 없습니다. 사용을 끄면 다음 로그인부터 접속할 수 없습니다.'));
}

const OP_KO = {INSERT:'추가', UPDATE:'수정', DELETE:'삭제'};
const FIELD_KO = {tx_date:'날짜', io:'입출금', category:'구분', item:'내역', amount:'금액', room_no:'호실', memo:'비고', doc_no:'처리번호',
                  name:'이름', phone:'전화', deposit:'보증금', rent:'월세', pay_day:'납부일', start_date:'시작일', end_date:'종료일',
                  status:'상태', move_out_date:'퇴실일', rent_month:'귀속월'};
const showVal = v => v == null || v === '' ? '(없음)' : typeof v === 'number' ? fmt(v) : String(v);
function auditText(l){
  const r = l.new_data || l.old_data || {};
  let s = l.table_name === 'ledger'
    ? `${r.doc_no || ''} · ${r.tx_date || ''} · ${r.room_no ? r.room_no + '호' : '공용'} · ${r.item || r.category || ''} · ${fmt(r.amount)}원`
    : `${r.room_no || ''}호 · ${r.name || ''}`;
  if(l.op === 'UPDATE' && l.old_data && l.new_data){
    const skip = new Set(['updated_at','updated_by','created_at','created_by','id']);
    const ch = Object.keys(l.new_data).filter(k => !skip.has(k) && JSON.stringify(l.old_data[k]) !== JSON.stringify(l.new_data[k]))
      .map(k => `${FIELD_KO[k] || k}: ${showVal(l.old_data[k])} → ${showVal(l.new_data[k])}`);
    s += ch.length ? '\n' + ch.join(' / ') : '\n(내용 변경 없음)';
  }
  return s;
}
async function renderAudit(){
  $app.innerHTML = '';
  pageHeader('<변경 이력>', '관리자', '최근 200건 · 금전출납부와 임차인 정보의 추가·수정·삭제 기록');
  const s = el('div','section'); s.append(el('div','empty','불러오는 중…')); $app.append(s);
  let logs, users;
  try{
    [logs, users] = await Promise.all([
      q(sb.from('audit_log').select('*').order('at', {ascending:false}).limit(200), '변경 이력 조회'),
      q(sb.from('profiles').select('user_id,name'), '사용자 조회')
    ]);
  }catch(e){ return; }
  if(location.hash !== '#/audit') return;
  const nm = new Map(users.map(u => [u.user_id, u.name]));
  s.innerHTML = '';
  if(!logs.length){ s.append(el('div','empty','기록이 없습니다.')); return; }
  s.append(table(['일시','사용자','대상','작업','내용'], logs.map(l => [
    new Date(l.at).toLocaleString('ko-KR', {dateStyle:'short', timeStyle:'short'}),
    nm.get(l.user_id) || '-',
    l.table_name === 'ledger' ? '출납부' : '임차인',
    {v:OP_KO[l.op] || l.op, cls:l.op === 'DELETE' ? 'in' : ''},
    {v:auditText(l), cls:'memo'}
  ])));
}

// =====================================================================
// 11. 페이지 이동 (#해시 방식: GitHub Pages에서 그대로 동작)
// =====================================================================
function router(){
  if(!me) return;
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  document.body.style.overflow = '';
  ui.stale = false;
  const h = location.hash;
  if(h === '#/common') renderCommon();
  else if(h === '#/extenants') renderExTenants();
  else if(h === '#/users' && can.admin) renderUsers();
  else if(h === '#/audit' && can.admin) renderAudit();
  else if(h.startsWith('#/room/')) renderRoom(h.split('/')[2]);
  else renderMain();
}
window.addEventListener('hashchange', () => { router(); window.scrollTo(0,0); });

(async () => {
  const {data:{session}} = await sb.auth.getSession();
  if(session) afterLogin(); else renderLogin();
})();
